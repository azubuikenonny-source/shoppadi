distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
# services.gradle.org will not transfer this zip over HTTP/2 on some Nigerian
# ISPs, and the wrapper cannot resume a stalled download. The distribution was
# fetched once with curl --http1.1 and is loaded from disk instead.
# Restore the https URL on a machine with an unrestricted connection.
distributionUrl=file\:///C:/Users/PC/gradle-9.1.0-bin.zip
